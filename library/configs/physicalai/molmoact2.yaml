# MolmoAct2 Policy Training Configuration
#
# Usage:
#   physicalai fit --config configs/physicalai/molmoact2.yaml
model:
  class_path: physicalai.policies.MolmoAct2
  init_args:
    # Pretrained checkpoint
    repo_id: allenai/MolmoAct2-LIBERO
    norm_tag: libero
    load_weights: true
    # Input / output structure
    n_obs_steps: 30
    n_action_steps: 10
    chunk_size: 30
    # Action mode (only "continuous" is currently supported)
    action_mode: continuous
    # SO-100/101 joint calibration correction (needed for zero-shot / finetuning
    # from the pre-#777 LeRobot calibration checkpoint)
    adapt_to_so101: false
    # Compile-oriented config flags
    compile_model: false

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    repo_id: "lerobot/libero"
    train_batch_size: 8
    data_format: "physicalai"

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: 32
  log_every_n_steps: 100
  check_val_every_n_epoch: 10
